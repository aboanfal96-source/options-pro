<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TADAWUL OPTIONS PRO | منصة الخيارات الاستباقية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#080c14;--bg1:#0c1220;--bg2:#111a2e;--bg3:#182440;--bg4:#1e3055;
--t1:#e8ecf4;--t2:#8b9ec2;--t3:#5a6f96;
--g:#00e676;--g2:#00c853;--g3:rgba(0,230,118,.1);--g4:rgba(0,230,118,.03);
--r:#ff1744;--r2:#d50000;--r3:rgba(255,23,68,.1);--r4:rgba(255,23,68,.03);
--b:#448aff;--b3:rgba(68,138,255,.1);
--y:#ffab00;--y3:rgba(255,171,0,.1);
--p:#e040fb;--p3:rgba(224,64,251,.1);
--o:#ff6e40;--o3:rgba(255,110,64,.1);
--c:#00e5ff;--c3:rgba(0,229,255,.1);
--gd:#ffd740;
--brd:#1a2744;--brd2:#243656;
--rad:6px;--rad2:10px;
--f:'Tajawal',sans-serif;--m:'JetBrains Mono',monospace;
}
body{font-family:var(--f);background:var(--bg);color:var(--t1);font-size:13px;overflow:hidden;height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:var(--bg1)}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:2px}
input,select,button,textarea{font-family:var(--f);outline:none;border:none;background:none;color:var(--t1)}button{cursor:pointer}
.bx{background:var(--bg1);border:1px solid var(--brd);border-radius:var(--rad2)}
.bdg{padding:2px 7px;border-radius:3px;font-size:9px;font-weight:700;display:inline-block;letter-spacing:.3px}
.bdg-g{background:var(--g3);color:var(--g)}.bdg-r{background:var(--r3);color:var(--r)}
.bdg-b{background:var(--b3);color:var(--b)}.bdg-y{background:var(--y3);color:var(--y)}
.bdg-p{background:var(--p3);color:var(--p)}.bdg-o{background:var(--o3);color:var(--o)}
.bdg-c{background:var(--c3);color:var(--c)}

/* === TOPBAR === */
#topbar{height:28px;background:var(--bg1);border-bottom:1px solid var(--brd);display:flex;align-items:center;overflow:hidden;flex-shrink:0}
#ticker{display:flex;gap:24px;white-space:nowrap;animation:tickScroll 50s linear infinite;padding:0 20px}
@keyframes tickScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tk{font-size:10px;display:flex;align-items:center;gap:5px;font-family:var(--m)}
.tk .s{color:var(--t2);font-weight:700;font-size:11px}

/* === HEADER === */
#hdr{height:44px;background:var(--bg1);border-bottom:1px solid var(--brd);display:flex;align-items:center;padding:0 12px;gap:12px;flex-shrink:0}
#logo{font-size:16px;font-weight:900;display:flex;align-items:center;gap:6px}
#logo em{font-style:normal;color:var(--gd);font-size:10px;background:rgba(255,215,64,.12);padding:1px 6px;border-radius:3px}
#symIn{background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rad);padding:5px 12px;width:140px;font-size:14px;font-weight:700;text-align:center;text-transform:uppercase;font-family:var(--m);letter-spacing:1px;transition:.2s}
#symIn:focus{border-color:var(--gd);box-shadow:0 0 0 2px rgba(255,215,64,.1)}
.htabs{display:flex;gap:2px}
.htab{padding:5px 12px;border-radius:var(--rad);font-size:11px;font-weight:600;color:var(--t3);transition:.2s;white-space:nowrap}
.htab:hover{background:var(--bg2);color:var(--t2)}.htab.on{background:var(--bg3);color:var(--gd)}
#clock{font-family:var(--m);font-size:11px;color:var(--t3);margin-right:auto}
#mstat{font-size:10px}

/* === MAIN LAYOUT === */
#main{flex:1;display:flex;overflow:hidden}
#center{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#side{width:320px;background:var(--bg1);border-right:1px solid var(--brd);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}

/* === INFO BAR === */
#info{display:flex;align-items:center;gap:14px;padding:6px 10px;background:var(--bg1);border-bottom:1px solid var(--brd);flex-wrap:wrap;flex-shrink:0}
.i-price{font-size:26px;font-weight:900;font-family:var(--m);letter-spacing:-1px}
.i-chg{font-size:12px;font-weight:700;padding:3px 8px;border-radius:var(--rad);font-family:var(--m)}
.i-sep{width:1px;height:28px;background:var(--brd)}
.i-st{text-align:center}.i-st .l{font-size:8px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}.i-st .v{font-size:12px;font-weight:600;font-family:var(--m)}

/* === CHART === */
#chartBox{position:relative;flex-shrink:0;background:var(--bg1);border-bottom:1px solid var(--brd)}
#chHdr{display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid var(--brd);flex-wrap:wrap}
.cb{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;color:var(--t3);transition:.15s}
.cb:hover{background:var(--bg3);color:var(--t2)}.cb.on{color:var(--gd);background:rgba(255,215,64,.08)}
#cv{width:100%;display:block;cursor:crosshair}
#crossInfo{position:absolute;top:40px;left:8px;font-size:10px;font-family:var(--m);color:var(--t2);pointer-events:none;z-index:5}

/* === TABS === */
#tabBox{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
#tabHdr{display:flex;background:var(--bg);border-bottom:1px solid var(--brd);overflow-x:auto;flex-shrink:0}
.tb{padding:8px 14px;font-size:11px;font-weight:600;color:var(--t3);white-space:nowrap;border-bottom:2px solid transparent;transition:.15s}
.tb:hover{color:var(--t2)}.tb.on{color:var(--gd);border-bottom-color:var(--gd)}
#tabBody{flex:1;overflow-y:auto;padding:6px}

/* === OPTIONS TABLE === */
.otbl{width:100%;border-collapse:collapse;font-size:10px;font-family:var(--m)}
.otbl th{background:var(--bg);padding:5px 6px;text-align:center;color:var(--t3);font-weight:600;position:sticky;top:0;z-index:3;font-size:9px;letter-spacing:.3px}
.otbl td{padding:4px 6px;text-align:center;border-bottom:1px solid rgba(26,39,68,.5)}
.otbl tr:hover td{background:var(--bg2)}
.otbl .stk{background:var(--bg);font-weight:700;color:var(--gd);border-left:2px solid var(--gd);border-right:2px solid var(--gd);position:relative}
.otbl .itm-c{background:var(--g4)}.otbl .itm-p{background:var(--r4)}
.otbl .atm-row{background:rgba(255,215,64,.04) !important}
.otbl .atm-row .stk{background:rgba(255,215,64,.12)}
.vbar{display:inline-block;height:3px;border-radius:1px;vertical-align:middle;margin-left:3px}

/* === GAMMA WALL === */
#gCv{width:100%;height:260px;display:block}
.g-leg{display:flex;gap:12px;padding:6px 0;justify-content:center;font-size:10px}
.g-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-left:4px;vertical-align:middle}

/* === GREEKS === */
.gk-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.gk-card{background:var(--bg2);border-radius:var(--rad);padding:10px;text-align:center;border:1px solid var(--brd)}
.gk-card .nm{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.gk-card .vl{font-size:20px;font-weight:900;font-family:var(--m);margin-bottom:2px}
.gk-card .dr{font-size:9px;line-height:1.3}
.gk-card .bar{height:3px;background:var(--bg);border-radius:2px;margin-top:5px;overflow:hidden}
.gk-card .fill{height:100%;border-radius:2px;transition:.4s}
.gk-summary{padding:8px 10px;background:var(--bg2);border-radius:var(--rad);margin-top:8px;font-size:11px;line-height:1.7;border-right:3px solid var(--gd)}

/* === STRATEGY BUILDER === */
.st-presets{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.st-pb{padding:4px 10px;border-radius:var(--rad);font-size:10px;font-weight:600;border:1px solid var(--brd);transition:.15s}
.st-pb:hover{border-color:var(--b);color:var(--b)}.st-pb.on{background:var(--b3);color:var(--b);border-color:var(--b)}
.st-leg{display:flex;align-items:center;gap:6px;padding:5px;background:var(--bg2);border-radius:var(--rad);margin-bottom:3px;font-size:11px}
.st-leg select,.st-leg input{background:var(--bg);border:1px solid var(--brd);border-radius:3px;padding:3px 6px;font-size:10px;font-family:var(--m)}
.st-leg select{width:70px}.st-leg input{width:60px;text-align:center}
.st-leg .rm{color:var(--r);font-size:12px;padding:2px 5px;border-radius:3px;transition:.15s}
.st-leg .rm:hover{background:var(--r3)}
#plCv{width:100%;height:200px;display:block;background:var(--bg);border-radius:var(--rad);border:1px solid var(--brd);margin-top:8px}
.st-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
.st-s{background:var(--bg2);border-radius:var(--rad);padding:6px;text-align:center}
.st-s .sl{font-size:8px;color:var(--t3);letter-spacing:.3px}.st-s .sv{font-size:13px;font-weight:700;font-family:var(--m)}

/* === FEAR/GREED === */
#fgCv{width:240px;height:145px;margin:0 auto;display:block}
.fg-val{font-size:38px;font-weight:900;font-family:var(--m);text-align:center;margin:6px 0}
.fg-lbl{font-size:13px;font-weight:700;text-align:center;margin-bottom:10px}
.fg-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:10px}
.fg-f{display:flex;justify-content:space-between;padding:3px 6px;background:var(--bg2);border-radius:3px}

/* === SIDE PANEL === */
.sp{border-bottom:1px solid var(--brd);padding:8px 10px}
.sp-t{font-size:11px;font-weight:700;color:var(--gd);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.wl-i{display:flex;justify-content:space-between;align-items:center;padding:4px 6px;border-radius:3px;cursor:pointer;transition:.1s;font-size:11px}
.wl-i:hover{background:var(--bg2)}.wl-i.act{background:var(--bg3)}
.wl-i .ws{font-weight:700}.wl-i .wp{font-family:var(--m);font-size:11px}

/* === FLOW === */
.fl{display:flex;align-items:center;gap:6px;padding:4px 6px;background:var(--bg2);border-radius:var(--rad);margin-bottom:3px;border-right:3px solid var(--g);font-size:10px}
.fl.bear{border-right-color:var(--r)}

/* === AI CHAT === */
#aiWrap{flex:1;display:flex;flex-direction:column;min-height:200px;overflow:hidden}
#aiMsgs{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:6px}
.ai-m{padding:6px 10px;border-radius:var(--rad);font-size:11px;line-height:1.6;max-width:92%}
.ai-m.u{background:var(--b3);color:var(--b);align-self:flex-end;border-bottom-left-radius:var(--rad)}
.ai-m.b{background:var(--bg2);align-self:flex-start;border-bottom-right-radius:var(--rad);border-right:2px solid var(--gd)}
.ai-q{display:flex;flex-wrap:wrap;gap:3px;padding:4px 6px}
.ai-qb{font-size:9px;padding:2px 7px;border-radius:10px;border:1px solid var(--brd);color:var(--t3);transition:.15s}
.ai-qb:hover{border-color:var(--gd);color:var(--gd)}
#aiBar{display:flex;gap:4px;padding:6px;border-top:1px solid var(--brd)}
#aiIn{flex:1;background:var(--bg2);border:1px solid var(--brd);border-radius:var(--rad);padding:6px 10px;font-size:11px;resize:none;height:34px}
#aiIn:focus{border-color:var(--gd)}
#aiSnd{background:var(--gd);color:var(--bg);font-weight:700;padding:0 14px;border-radius:var(--rad);font-size:12px;transition:.15s}
#aiSnd:hover{filter:brightness(1.15)}

/* === PULSE === */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.pulse{animation:pulse 1.5s infinite}
@keyframes glow{0%,100%{box-shadow:0 0 5px rgba(255,215,64,.2)}50%{box-shadow:0 0 15px rgba(255,215,64,.4)}}

/* === LOADING === */
.loading{text-align:center;padding:30px;color:var(--t3);font-size:12px}
.spin{display:inline-block;width:20px;height:20px;border:2px solid var(--brd);border-top-color:var(--gd);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* === RESPONSIVE === */
@media(max-width:900px){#side{display:none}#main{flex-direction:column}}
</style>
</head>

    <!-- INFO -->

      <div><div id="sName" style="font-size:10px;color:var(--t3)">APPLE INC</div>

<script>
/* ================================================================
   TADAWUL OPTIONS PRO v2 — PREDICTIVE OPTIONS ENGINE
   ================================================================ */

// ──── STATE ────
const S = {
  sym:'AAPL', price:0, prevClose:0, name:'',
  candles:[], calls:[], puts:[], expirations:[], expiry:null,
  tf:'15m', ind:{ema:true,bb:false,vwap:true,gwall:true},
  tab:'opt', gammaLevels:[], greeks:{d:0,g:0,v:0,t:0},
  pcr:1, ivr:50, fg:50, flowAlerts:[],
  stratLegs:[], stratPreset:'',
  wl:['AAPL','TSLA','NVDA','MSFT','AMZN','META','GOOGL','SPY','QQQ','AMD','NFLX','COIN'],
  wlD:{}, loading:false
};
const TFM = {
  '5m':{range:'1d',interval:'5m'},'15m':{range:'5d',interval:'15m'},
  '1h':{range:'1mo',interval:'60m'},'1d':{range:'6mo',interval:'1d'},'1wk':{range:'2y',interval:'1wk'}
};

// ──── HELPERS ────
const $=id=>document.getElementById(id);
const fN=(n,d=2)=>n!=null?Number(n).toFixed(d):'-';
const fK=n=>{if(n==null)return'-';const a=Math.abs(n);if(a>=1e9)return(n/1e9).toFixed(1)+'B';if(a>=1e6)return(n/1e6).toFixed(1)+'M';if(a>=1e3)return(n/1e3).toFixed(1)+'K';return fN(n,0)};
const clr=v=>v>0?'var(--g)':v<0?'var(--r)':'var(--t2)';
const pct=(v,t)=>Math.min(100,Math.max(0,Math.abs(v)/Math.max(t,1)*100));

// ──── BLACK-SCHOLES ────
function normCDF(x){
  const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911;
  const s=x<0?-1:1; x=Math.abs(x)/Math.SQRT2;
  const t=1/(1+p*x);
  return .5*(1+s*(1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x)));
}
function normPDF(x){return Math.exp(-x*x/2)/Math.sqrt(2*Math.PI)}
function bsG(spot,K,T,r,sig,type){
  if(T<=0||sig<=0)return{d:0,g:0,t:0,v:0};
  const d1=(Math.log(spot/K)+(r+sig*sig/2)*T)/(sig*Math.sqrt(T));
  const d2=d1-sig*Math.sqrt(T);
  const nd1=normPDF(d1);
  const g=nd1/(spot*sig*Math.sqrt(T));
  const v=spot*nd1*Math.sqrt(T)/100;
  let d,t;
  if(type==='call'){
    d=normCDF(d1);
    t=(-(spot*nd1*sig)/(2*Math.sqrt(T))-r*K*Math.exp(-r*T)*normCDF(d2))/365;
  }else{
    d=normCDF(d1)-1;
    t=(-(spot*nd1*sig)/(2*Math.sqrt(T))+r*K*Math.exp(-r*T)*normCDF(-d2))/365;
  }
  return{d:+d.toFixed(4),g:+g.toFixed(6),t:+t.toFixed(4),v:+v.toFixed(4)};
}

// ──── GAMMA EXPOSURE ────
function calcGEX(calls,puts,spot){
  const levels={};
  const r=.05;
  const process=(arr,type)=>{
    arr.forEach(o=>{
      const K=o.strike,oi=o.oi||0;
      if(!oi)return;
      const T=o.expiry?Math.max((o.expiry*1000-Date.now())/(365.25*864e5),1/365):30/365;
      const sig=o.iv||.3;
      const gk=bsG(spot,K,T,r,sig,type);
      const gex=gk.g*oi*100*spot*spot*.01;
      if(!levels[K])levels[K]={strike:K,cGEX:0,pGEX:0,net:0,cOI:0,pOI:0,cVol:0,pVol:0};
      if(type==='call'){levels[K].cGEX+=gex;levels[K].cOI+=oi;levels[K].cVol+=(o.vol||0);}
      else{levels[K].pGEX-=gex;levels[K].pOI+=oi;levels[K].pVol+=(o.vol||0);}
      levels[K].net=levels[K].cGEX+levels[K].pGEX;
    });
  };
  process(calls,'call');process(puts,'put');
  return Object.values(levels).sort((a,b)=>a.strike-b.strike);
}

// ──── AGGREGATE GREEKS ────
function calcAggG(calls,puts,spot){
  let td=0,tg=0,tv=0,tt=0,cV=0,pV=0,cOI=0,pOI=0;
  const r=.05;
  const proc=(arr,type)=>{
    arr.forEach(o=>{
      const T=o.expiry?Math.max((o.expiry*1000-Date.now())/(365.25*864e5),1/365):30/365;
      const gk=bsG(spot,o.strike,T,r,o.iv||.3,type);
      const w=o.oi||1;
      td+=gk.d*w;tg+=gk.g*w;tv+=gk.v*w;tt+=gk.t*w;
      if(type==='call'){cV+=o.vol||0;cOI+=o.oi||0;}else{pV+=o.vol||0;pOI+=o.oi||0;}
    });
  };
  proc(calls,'call');proc(puts,'put');
  S.pcr=cV>0?+(pV/cV).toFixed(2):1;
  S.greeks={d:Math.round(td),g:+tg.toFixed(2),v:Math.round(tv),t:Math.round(tt)};
  // IV Rank approximation
  const avgIV=[...calls,...puts].reduce((s,o)=>s+(o.iv||.3),0)/Math.max(1,calls.length+puts.length);
  S.ivr=Math.min(100,Math.max(0,Math.round(avgIV*250)));
  // Fear/Greed composite
  const pcS=S.pcr>1.2?25:S.pcr<.7?75:50+(0.95-S.pcr)*80;
  const ivS=100-Math.min(100,avgIV*200);
  const dS=td>0?Math.min(100,50+td/200):Math.max(0,50+td/200);
  const gexNet=S.gammaLevels.reduce((s,l)=>s+l.net,0);
  const gS=gexNet>0?60:35;
  S.fg=Math.round(pcS*.3+ivS*.25+dS*.25+gS*.2);
}

// ──── STRATEGY P/L ────
function calcPL(legs,spot,range=.25){
  const mn=spot*(1-range),mx=spot*(1+range),pts=[];
  for(let p=mn;p<=mx;p+=(mx-mn)/250){
    let pl=0;
    legs.forEach(l=>{
      const mult=l.side==='buy'?1:-1;
      const intr=l.type==='call'?Math.max(0,p-l.strike):Math.max(0,l.strike-p);
      pl+=(intr-l.premium)*l.qty*mult*100;
    });
    pts.push({p,pl});
  }
  const mxP=Math.max(...pts.map(x=>x.pl));
  const mnP=Math.min(...pts.map(x=>x.pl));
  const bes=[];
  for(let i=1;i<pts.length;i++){
    if((pts[i-1].pl<0&&pts[i].pl>=0)||(pts[i-1].pl>=0&&pts[i].pl<0))bes.push(+pts[i].p.toFixed(2));
  }
  return{pts,mxP,mnP,bes};
}

function genFlow(){

        const sweep=(o.vol||0)>Math.max(o.oi||0,1)*3;
        const prem=(o.ask||o.last||0)*(o.vol||0)*100;
        alerts.push({
          sym:S.sym,strike:o.strike,side,

          vol:o.vol,oi:o.oi,prem,
          bull:side==='CALL',
          score:Math.min(100,Math.round(((o.vol||0)/Math.max(o.oi||0,1))*20+(prem>500000?30:prem>100000?15:0))),
          time:new Date().toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'})
        });
      }
    });
  };
  proc(S.calls,'CALL');proc(S.puts,'PUT');
  alerts.sort((a,b)=>b.prem-a.prem);
  S.flowAlerts=alerts.slice(0,20);
  renderSideFlow();
}

// ──── INDICATORS ────
function calcEMA(data,p){const k=2/(p+1);const e=[data[0]];for(let i=1;i<data.length;i++)e.push(data[i]*k+e[i-1]*(1-k));return e;}
function calcBB(data,p=20,m=2){
  const r={u:[],mid:[],l:[]};
  for(let i=0;i<data.length;i++){
    if(i<p-1){r.u.push(null);r.mid.push(null);r.l.push(null);continue;}
    const sl=data.slice(i-p+1,i+1);
    const mn=sl.reduce((a,b)=>a+b)/p;
    const sd=Math.sqrt(sl.reduce((s,v)=>s+(v-mn)**2,0)/p);
    r.mid.push(mn);r.u.push(mn+m*sd);r.l.push(mn-m*sd);
  }return r;
}
function calcVWAP(c){let cv=0,cV=0;return c.map(x=>{const tp=(x.h+x.l+x.c)/3;cv+=tp*(x.v||0);cV+=(x.v||0);return cV>0?cv/cV:null;});}

// ──── CHART ────
function drawChart(){
  const canvas=$('cv');const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const W=canvas.parentElement.clientWidth,H=360;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+'px';canvas.style.height=H+'px';
  ctx.scale(dpr,dpr);
  const data=S.candles;
  if(!data.length){ctx.fillStyle='#5a6f96';ctx.font='13px Tajawal';ctx.textAlign='center';ctx.fillText('⏳ جاري تحميل البيانات...',W/2,H/2);return;}

  const pad={t:8,r:56,b:24,l:6};
  const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  const prices=data.flatMap(c=>[c.h,c.l]);
  let lo=Math.min(...prices),hi=Math.max(...prices);
  const rng=hi-lo||1;lo-=rng*.04;hi+=rng*.04;
  const pxC=cW/data.length;
  const toX=i=>pad.l+i*pxC+pxC/2;
  const toY=p=>pad.t+(1-(p-lo)/(hi-lo))*cH;

  // BG
  ctx.fillStyle='#080c14';ctx.fillRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='rgba(255,255,255,.03)';ctx.lineWidth=1;
  for(let i=0;i<6;i++){
    const y=pad.t+(cH/5)*i;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
    const pr=hi-(hi-lo)*(i/5);
    ctx.fillStyle='#5a6f96';ctx.font='9px JetBrains Mono';ctx.textAlign='left';
    ctx.fillText('$'+fN(pr,pr>1000?0:2),W-pad.r+3,y+3);
  }

  // Gamma walls on chart
  if(S.ind.gwall&&S.gammaLevels.length){
    const mxG=Math.max(...S.gammaLevels.map(l=>Math.abs(l.net)),1);
    S.gammaLevels.forEach(gl=>{
      if(gl.strike<lo||gl.strike>hi||Math.abs(gl.net)<mxG*.05)return;
      const y=toY(gl.strike);
      const alpha=Math.min(.6,Math.abs(gl.net)/mxG*.7);
      ctx.strokeStyle=gl.net>0?`rgba(0,230,118,${alpha})`:`rgba(255,23,68,${alpha})`;
      ctx.lineWidth=1.5;ctx.setLineDash([5,4]);
      ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle=gl.net>0?`rgba(0,230,118,${alpha+.2})`:`rgba(255,23,68,${alpha+.2})`;
      ctx.font='8px JetBrains Mono';ctx.textAlign='right';
      ctx.fillText('γ'+fN(gl.strike,0),W-pad.r-2,y-2);
    });
  }

  // EMA
  if(S.ind.ema&&data.length>20){
    [[9,'#ffab00'],[21,'#448aff'],[50,'#e040fb']].forEach(([p,c])=>{
      const e=calcEMA(data.map(x=>x.c),p);
      ctx.strokeStyle=c;ctx.lineWidth=1;ctx.globalAlpha=.7;
      ctx.beginPath();e.forEach((v,i)=>{const x=toX(i);i===0?ctx.moveTo(x,toY(v)):ctx.lineTo(x,toY(v));});ctx.stroke();
      ctx.globalAlpha=1;
    });
  }

  // BB
  if(S.ind.bb&&data.length>20){
    const bb=calcBB(data.map(x=>x.c),20);
    ctx.globalAlpha=.4;ctx.strokeStyle='#e040fb';ctx.lineWidth=.8;
    ['u','l'].forEach(band=>{ctx.beginPath();bb[band].forEach((v,i)=>{if(v){const x=toX(i);!bb[band][i-1]?ctx.moveTo(x,toY(v)):ctx.lineTo(x,toY(v));}});ctx.stroke();});
    ctx.fillStyle='rgba(224,64,251,.03)';ctx.beginPath();
    bb.u.forEach((v,i)=>{if(v)ctx.lineTo(toX(i),toY(v));});
    for(let i=bb.l.length-1;i>=0;i--)if(bb.l[i])ctx.lineTo(toX(i),toY(bb.l[i]));
    ctx.fill();ctx.globalAlpha=1;
  }

  // VWAP
  if(S.ind.vwap&&data.length>3){
    const vw=calcVWAP(data);
    ctx.strokeStyle='#00e5ff';ctx.lineWidth=1.2;ctx.setLineDash([3,2]);
    ctx.beginPath();vw.forEach((v,i)=>{if(v){const x=toX(i);i===0||!vw[i-1]?ctx.moveTo(x,toY(v)):ctx.lineTo(x,toY(v));}});ctx.stroke();ctx.setLineDash([]);
  }

  // Candles
  data.forEach((c,i)=>{
    const x=toX(i);const bull=c.c>=c.o;
    const bT=toY(Math.max(c.o,c.c)),bB=toY(Math.min(c.o,c.c));
    const bH=Math.max(1,bB-bT);
    const cw=Math.max(1.5,pxC*.65);
    ctx.strokeStyle=bull?'#00e676':'#ff1744';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,toY(c.h));ctx.lineTo(x,toY(c.l));ctx.stroke();
    if(bull){ctx.fillStyle='rgba(0,230,118,.15)';ctx.fillRect(x-cw/2,bT,cw,bH);ctx.strokeRect(x-cw/2,bT,cw,bH);}
    else{ctx.fillStyle='#ff1744';ctx.fillRect(x-cw/2,bT,cw,bH);}
  });

  // Current price
  if(S.price&&S.price>=lo&&S.price<=hi){
    const y=toY(S.price);
    ctx.strokeStyle='#ffd740';ctx.lineWidth=1;ctx.setLineDash([3,2]);
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='#ffd740';
    ctx.beginPath();ctx.moveTo(W-pad.r,y-9);ctx.lineTo(W-pad.r+50,y-9);ctx.lineTo(W-pad.r+50,y+9);ctx.lineTo(W-pad.r,y+9);ctx.fill();
    ctx.fillStyle='#080c14';ctx.font='bold 9px JetBrains Mono';ctx.textAlign='left';ctx.fillText('$'+fN(S.price),W-pad.r+3,y+3);
  }

  // Time labels
  ctx.fillStyle='#5a6f96';ctx.font='8px JetBrains Mono';ctx.textAlign='center';
  const skip=Math.ceil(data.length/8);
  data.forEach((c,i)=>{
    if(i%skip===0){
      const d=new Date(c.t);
      const lbl=S.tf==='1d'||S.tf==='1wk'?d.toLocaleDateString('en',{month:'short',day:'numeric'}):d.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'});
      ctx.fillText(lbl,toX(i),H-6);
    }
  });

  // Volume mini bars
  const mxV=Math.max(...data.map(c=>c.v||0),1);
  data.forEach((c,i)=>{
    if(!c.v)return;const x=toX(i);
    const bH=(c.v/mxV)*35;
    ctx.fillStyle=c.c>=c.o?'rgba(0,230,118,.08)':'rgba(255,23,68,.08)';
    ctx.fillRect(x-pxC*.3,H-pad.b-bH,pxC*.6,bH);
  });

  // Crosshair handler
  canvas.onmousemove=e=>{
    const rect=canvas.getBoundingClientRect();
    const mx=e.clientX-rect.left,my=e.clientY-rect.top;
    const idx=Math.round((mx-pad.l)/pxC-.5);
    if(idx>=0&&idx<data.length){
      const c=data[idx];const d=new Date(c.t);
      $('crossInfo').innerHTML=`<span style="color:var(--gd)">${d.toLocaleDateString('en',{month:'short',day:'numeric'})}</span> O:${fN(c.o)} H:${fN(c.h)} L:${fN(c.l)} C:<span style="color:${c.c>=c.o?'var(--g)':'var(--r)'}">${fN(c.c)}</span> V:${fK(c.v)}`;
    }
  };
  canvas.onmouseleave=()=>{$('crossInfo').innerHTML='';};
}

// ──── GAMMA WALL ────
function renderGamma(el){
  const lv=S.gammaLevels;
  if(!lv.length){el.innerHTML='<div class="loading">لا توجد بيانات غاما</div>';return;}
  const mxPos=lv.reduce((m,l)=>l.net>m.net?l:m,lv[0]);
  const mxNeg=lv.reduce((m,l)=>l.net<m.net?l:m,lv[0]);
  const flip=lv.find((l,i)=>i>0&&lv[i-1].net*l.net<0);
  const tNet=lv.reduce((s,l)=>s+l.net,0);

  el.innerHTML=`<div style="padding:4px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <span style="font-size:13px;font-weight:800">🧱 جدار الغاما — Gamma Exposure Wall</span>

      ⬇️ <b>أقوى دعم:</b> $${fN(mxNeg.strike,0)} — جدار Put، صُناع السوق مُلزمون بالشراء هنا<br>
      ${flip?`🔄 <b>Gamma Flip:</b> $${fN(flip.strike,0)} — فوقها حركة مكبوتة (Mean Revert)، تحتها انفجار سعري<br>`:''}
      📈 <b>النتيجة:</b> <span style="color:${tNet>0?'var(--g)':'var(--r)'}">${tNet>0?'GEX موجب → السوق مستقر، صُناع السوق يكبحون الحركة':'GEX سالب → السوق هش، توقع تحركات عنيفة وانفجارات'}</span>
    </div></div>`;
  setTimeout(()=>drawGamma(lv),30);
}

function drawGamma(levels){
  const cv=$('gCv');if(!cv)return;
  const ctx=cv.getContext('2d');const dpr=window.devicePixelRatio||1;
  const W=cv.parentElement.clientWidth,H=260;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.scale(dpr,dpr);
  const pad={t:15,r:50,b:30,l:6};
  const near=levels.filter(l=>Math.abs(l.strike-S.price)/S.price<.12);
  if(!near.length)return;
  const mxG=Math.max(...near.map(l=>Math.max(Math.abs(l.cGEX),Math.abs(l.pGEX))),1);
  const bW=Math.min(25,(W-pad.l-pad.r)/near.length*.55);
  const cH=H-pad.t-pad.b;const zY=pad.t+cH/2;

  ctx.fillStyle='#080c14';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pad.l,zY);ctx.lineTo(W-pad.r,zY);ctx.stroke();

  near.forEach((l,i)=>{
    const x=pad.l+(i/(near.length-1||1))*(W-pad.l-pad.r);
    // Call bars (up)
    const cH2=(l.cGEX/mxG)*(cH/2);
    if(cH2>1){
      const grad=ctx.createLinearGradient(0,zY-cH2,0,zY);
      grad.addColorStop(0,'rgba(0,230,118,.7)');grad.addColorStop(1,'rgba(0,230,118,.1)');
      ctx.fillStyle=grad;ctx.fillRect(x-bW/2,zY-cH2,bW*.45,cH2);
    }
    // Put bars (down)
    const pH=Math.abs(l.pGEX)/mxG*(cH/2);
    if(pH>1){
      const grad=ctx.createLinearGradient(0,zY,0,zY+pH);
      grad.addColorStop(0,'rgba(255,23,68,.1)');grad.addColorStop(1,'rgba(255,23,68,.7)');
      ctx.fillStyle=grad;ctx.fillRect(x+1,zY,bW*.45,pH);
    }
    // Net dot
    const nY=l.net>=0?zY-(l.net/mxG)*(cH/2)-4:zY+(-l.net/mxG)*(cH/2)+4;
    ctx.fillStyle=l.net>=0?'#00e676':'#ff1744';
    ctx.beginPath();ctx.arc(x,nY,2.5,0,Math.PI*2);ctx.fill();

    // Strike label
    const isNearest=Math.abs(l.strike-S.price)===Math.min(...near.map(n=>Math.abs(n.strike-S.price)));
    ctx.fillStyle=isNearest?'#ffd740':'#5a6f96';
    ctx.font=(isNearest?'bold ':'')+'8px JetBrains Mono';ctx.textAlign='center';
    ctx.save();ctx.translate(x,H-6);ctx.rotate(-.4);ctx.fillText('$'+fN(l.strike,0),0,0);ctx.restore();

    if(isNearest){
      ctx.strokeStyle='rgba(255,215,64,.3)';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,H-pad.b);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#ffd740';ctx.font='bold 9px Tajawal';ctx.fillText('▼ السعر',x,pad.t-2);
    }
  });
}

function applyPre(name){
  S.stratPreset=name;
  const strikes=[...new Set([...S.calls,...S.puts].map(o=>o.strike))].sort((a,b)=>a-b);
  if(!strikes.length)return;
  const ati=strikes.reduce((best,s,i)=>Math.abs(s-S.price)<Math.abs(strikes[best]-S.price)?i:best,0);
  const gS=(off)=>strikes[Math.max(0,Math.min(strikes.length-1,ati+off))];
  const gP=(strike,type,side)=>{
    const arr=type==='call'?S.calls:S.puts;
    const o=arr.find(x=>x.strike===strike)||{ask:5,bid:4,last:4.5};
    return side==='buy'?(o.ask||o.last||5):(o.bid||o.last||4);
  };
  const defs={
    'Long Call':[{type:'call',side:'buy',qty:1,o:0}],
    'Long Put':[{type:'put',side:'buy',qty:1,o:0}],
    'Bull Call Spread':[{type:'call',side:'buy',qty:1,o:0},{type:'call',side:'sell',qty:1,o:2}],
    'Bear Put Spread':[{type:'put',side:'buy',qty:1,o:0},{type:'put',side:'sell',qty:1,o:-2}],
    'Iron Condor':[{type:'put',side:'buy',qty:1,o:-3},{type:'put',side:'sell',qty:1,o:-1},{type:'call',side:'sell',qty:1,o:1},{type:'call',side:'buy',qty:1,o:3}],
    'Straddle':[{type:'call',side:'buy',qty:1,o:0},{type:'put',side:'buy',qty:1,o:0}],
    'Strangle':[{type:'call',side:'buy',qty:1,o:2},{type:'put',side:'buy',qty:1,o:-2}],
    'Butterfly':[{type:'call',side:'buy',qty:1,o:-2},{type:'call',side:'sell',qty:2,o:0},{type:'call',side:'buy',qty:1,o:2}],
    'Calendar Spread':[{type:'call',side:'buy',qty:1,o:0},{type:'call',side:'sell',qty:1,o:0}],
  };
  S.stratLegs=(defs[name]||defs['Long Call']).map(l=>{
    const strike=gS(l.o);
    return{type:l.type,side:l.side,qty:l.qty,strike,premium:gP(strike,l.type,l.side)};
  });
  document.querySelectorAll('.st-pb').forEach(b=>b.classList.toggle('on',b.textContent===name));
  renderLegs();
}

function addLeg(){
  const atm=S.calls.reduce((b,c)=>Math.abs(c.strike-S.price)<Math.abs(b.strike-S.price)?c:b,S.calls[0]||{strike:S.price,ask:5});
  S.stratLegs.push({type:'call',side:'buy',qty:1,strike:atm.strike,premium:atm.ask||5});
  renderLegs();
}

function renderLegs(){
  const el=$('stLegs');if(!el)return;
  const strikes=[...new Set([...S.calls,...S.puts].map(o=>o.strike))].sort((a,b)=>a-b);
  el.innerHTML=S.stratLegs.map((l,i)=>`
    <div class="st-leg">
      <span style="font-size:9px;color:var(--t3);min-width:18px">#${i+1}</span>
      <select onchange="uLeg(${i},'side',this.value)"><option value="buy"${l.side==='buy'?' selected':''}>شراء</option><option value="sell"${l.side==='sell'?' selected':''}>بيع</option></select>
      <select onchange="uLeg(${i},'type',this.value)"><option value="call"${l.type==='call'?' selected':''}>Call</option><option value="put"${l.type==='put'?' selected':''}>Put</option></select>
      <select onchange="uLeg(${i},'strike',+this.value)" style="width:90px">${strikes.map(s=>`<option value="${s}"${s===l.strike?' selected':''}>$${fN(s,s>=100?0:2)}</option>`).join('')}</select>
      <input type="number" value="${l.premium}" step="0.1" min="0" onchange="uLeg(${i},'premium',+this.value)" placeholder="Premium">

    </div>`).join('');
  drawPL();
}

function uLeg(i,f,v){
  S.stratLegs[i][f]=v;
  if(f==='strike'||f==='type'){
    const arr=S.stratLegs[i].type==='call'?S.calls:S.puts;
    const o=arr.find(x=>x.strike===(f==='strike'?v:S.stratLegs[i].strike));
    if(o)S.stratLegs[i].premium=S.stratLegs[i].side==='buy'?(o.ask||o.last):(o.bid||o.last);
  }
  renderLegs();
}
function rmLeg(i){S.stratLegs.splice(i,1);renderLegs();}

function drawPL(){
  const cv=$('plCv');if(!cv||!S.stratLegs.length)return;
  const ctx=cv.getContext('2d');const dpr=window.devicePixelRatio||1;
  const W=cv.parentElement.clientWidth,H=200;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.scale(dpr,dpr);
  const pad={t:15,r:50,b:25,l:6};

  const{pts,mxP,mnP,bes}=calcPL(S.stratLegs,S.price);
  if(!pts.length)return;
  const mnX=pts[0].p,mxX=pts[pts.length-1].p;
  const mnY=Math.min(mnP*1.2,-100),mxY=Math.max(mxP*1.2,100);
  const toX=p=>pad.l+(p-mnX)/(mxX-mnX)*(W-pad.l-pad.r);
  const toY=v=>pad.t+(1-(v-mnY)/(mxY-mnY))*(H-pad.t-pad.b);

  ctx.fillStyle='#080c14';ctx.fillRect(0,0,W,H);
  const zY=toY(0);
  ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(pad.l,zY);ctx.lineTo(W-pad.r,zY);ctx.stroke();

  // Fill areas
  ctx.beginPath();pts.forEach((p,i)=>{i===0?ctx.moveTo(toX(p.p),toY(p.pl)):ctx.lineTo(toX(p.p),toY(p.pl));});
  ctx.lineTo(toX(pts[pts.length-1].p),zY);ctx.lineTo(toX(pts[0].p),zY);ctx.closePath();
  const grad=ctx.createLinearGradient(0,pad.t,0,H-pad.b);
  grad.addColorStop(0,'rgba(0,230,118,.12)');grad.addColorStop(.5,'rgba(0,0,0,0)');grad.addColorStop(1,'rgba(255,23,68,.12)');
  ctx.fillStyle=grad;ctx.fill();

  // P/L line
  ctx.beginPath();ctx.strokeStyle='#ffd740';ctx.lineWidth=2;
  pts.forEach((p,i)=>{i===0?ctx.moveTo(toX(p.p),toY(p.pl)):ctx.lineTo(toX(p.p),toY(p.pl));});ctx.stroke();

  // Current price
  ctx.strokeStyle='rgba(255,215,64,.25)';ctx.setLineDash([3,3]);
  ctx.beginPath();ctx.moveTo(toX(S.price),pad.t);ctx.lineTo(toX(S.price),H-pad.b);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#ffd740';ctx.font='8px Tajawal';ctx.textAlign='center';ctx.fillText('السعر',toX(S.price),pad.t-3);

  // Breakevens
  bes.forEach(be=>{
    ctx.fillStyle='#00e5ff';ctx.beginPath();ctx.arc(toX(be),zY,4,0,Math.PI*2);ctx.fill();
    ctx.font='8px JetBrains Mono';ctx.fillText('BE $'+fN(be),toX(be),zY+14);
  });

  // Y labels
  ctx.fillStyle='#5a6f96';ctx.font='8px JetBrains Mono';ctx.textAlign='left';
  [mnY,0,mxY].forEach(v=>ctx.fillText('$'+fN(v,0),W-pad.r+3,toY(v)+3));

  // Stats
  const cost=S.stratLegs.reduce((s,l)=>s+l.premium*l.qty*100*(l.side==='buy'?1:-1),0);
  const ratio=mnP!==0?mxP/Math.abs(mnP):Infinity;
  const winP=bes.length?Math.max(15,Math.min(85,Math.round(60-Math.min(...bes.map(b=>Math.abs(b-S.price)/S.price*100))*5))):50;

  const stEl=$('stStats');
  if(stEl)stEl.innerHTML=`
    <div class="st-s"><div class="sl">أقصى ربح</div><div class="sv" style="color:var(--g)">${mxP>1e7?'∞':'$'+fK(mxP)}</div></div>
    <div class="st-s"><div class="sl">أقصى خسارة</div><div class="sv" style="color:var(--r)">$${fK(Math.abs(mnP))}</div></div>
    <div class="st-s"><div class="sl">التعادل</div><div class="sv" style="color:var(--c)">${bes.map(b=>'$'+fN(b)).join(' / ')||'-'}</div></div>
    <div class="st-s"><div class="sl">التكلفة</div><div class="sv" style="color:${cost>0?'var(--r)':'var(--g)'}">$${fN(Math.abs(cost))}</div></div>
    <div class="st-s"><div class="sl">عائد/مخاطرة</div><div class="sv" style="color:var(--gd)">${ratio>99?'∞':fN(ratio)+'x'}</div></div>
    <div class="st-s"><div class="sl">احتمال الربح</div><div class="sv" style="color:var(--p)">${winP}%</div></div>`;

  const anEl=$('stAn');
  if(anEl)anEl.innerHTML=`<strong style="color:var(--gd)">📐 تحليل الاستراتيجية:</strong><br>
    💰 <b>الربح:</b> ${mxP>1e7?'غير محدود ↑':'$'+fK(mxP)} | <b>الخسارة:</b> $${fK(Math.abs(mnP))}<br>
    ⏱ <b>Theta:</b> ${cost>0?'الوقت ضدك — كل يوم يُقلل القيمة':'أنت بائع — الوقت في صالحك'}<br>
    🎯 ${ratio>3?'نسبة عائد/مخاطرة ممتازة!':ratio>1.5?'نسبة جيدة — حافظ على انضباطك':'نسبة متوازنة — استخدم وقف خسارة'}`;
}

function drawFGauge(){
  const cv=$('fgCv');if(!cv)return;
  const ctx=cv.getContext('2d');const dpr=window.devicePixelRatio||1;
  cv.width=240*dpr;cv.height=145*dpr;cv.style.width='240px';cv.style.height='145px';
  ctx.scale(dpr,dpr);
  const cx=120,cy=130,rad=100;
  ctx.lineWidth=18;ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,255,255,.05)';ctx.beginPath();ctx.arc(cx,cy,rad,Math.PI,2*Math.PI);ctx.stroke();
  const grd=ctx.createLinearGradient(20,cy,220,cy);
  grd.addColorStop(0,'#ff1744');grd.addColorStop(.25,'#ff6e40');grd.addColorStop(.5,'#ffab00');grd.addColorStop(.75,'#8bc34a');grd.addColorStop(1,'#00e676');
  ctx.strokeStyle=grd;ctx.beginPath();ctx.arc(cx,cy,rad,Math.PI,2*Math.PI);ctx.stroke();
  const angle=Math.PI+(S.fg/100)*Math.PI;
  const nx=cx+Math.cos(angle)*(rad-12),ny=cy+Math.sin(angle)*(rad-12);
  ctx.strokeStyle='#ffd740';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(nx,ny);ctx.stroke();
  ctx.fillStyle='#ffd740';ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#ff1744';ctx.font='bold 9px Tajawal';ctx.textAlign='center';ctx.fillText('خوف',30,cy-6);
  ctx.fillStyle='#00e676';ctx.fillText('طمع',210,cy-6);
}

// ──── FLOW TAB ────
function renderFlow(el){
  if(!S.flowAlerts.length){el.innerHTML='<div class="loading">لا توجد تنبيهات تدفق حالياً</div>';return;}
  el.innerHTML=`<div><div style="font-size:13px;font-weight:800;margin-bottom:8px">🌊 تدفق السيولة الذكي</div>
    ${S.flowAlerts.map(a=>`<div class="fl${a.bull?'':' bear'}">
      <span style="font-weight:700;min-width:45px">${a.sym}</span>
      <span class="bdg ${a.bull?'bdg-g':'bdg-r'}">${a.side}</span>
      <span class="bdg ${a.type==='SWEEP'?'bdg-y':a.type==='BLOCK'?'bdg-p':'bdg-b'}">${a.type}</span>
      <span style="font-weight:600">$${fN(a.strike,0)}</span>
      <span style="font-family:var(--m);color:var(--t2);font-size:9px">V:${fK(a.vol)} OI:${fK(a.oi)}</span>
      <span style="font-weight:700;color:${a.bull?'var(--g)':'var(--r)'}">$${fK(a.prem)}</span>
      <span class="bdg bdg-c" style="margin-right:auto">${a.score}%</span>
      <span style="font-size:9px;color:var(--t3)">${a.time}</span>
    </div>`).join('')}</div>`;
}

// ──── SCANNER ────
function renderScan(el){
  const scSyms=['AAPL','TSLA','NVDA','MSFT','AMZN','META','GOOGL','AMD','NFLX','COIN','SPY','QQQ'];

    <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px">

    </div></div>`;
}

// ──── SIDE FLOW ────
function renderSideFlow(){
  const el=$('sideFlow');if(!el)return;
  el.innerHTML=S.flowAlerts.slice(0,5).map(a=>`
    <div class="fl${a.bull?'':' bear'}" style="font-size:9px;padding:3px 5px">
      <span style="font-weight:700">${a.sym}</span>
      <span class="bdg ${a.bull?'bdg-g':'bdg-r'}" style="font-size:7px">${a.side}</span>
      <span>$${fN(a.strike,0)}</span>

    </div>`).join('');

// ──── WATCHLIST ────
function renderWL(){
  const el=$('wl');if(!el)return;
  el.innerHTML=S.wl.map(sym=>{
    const d=S.wlD[sym]||{};const up=(d.chg||0)>=0;
    return`<div class="wl-i${sym===S.sym?' act':''}" onclick="go('${sym}')">
      <span class="ws">${sym}</span>
      <span class="wp" style="color:${up?'var(--g)':'var(--r)'}">
        ${d.price?'$'+fN(d.price):'—'} <span style="font-size:9px">${d.pct?(up?'+':'')+d.pct+'%':''}</span>
      </span></div>`;
  }).join('');

// ──── AI ────
async function sendAI(){
  const inp=$('aiIn');const msg=inp.value.trim();if(!msg)return;inp.value='';
  const ms=$('aiMsgs');
  ms.innerHTML+=`<div class="ai-m u">${msg}</div>`;
  ms.innerHTML+=`<div class="ai-m b" id="aiTmp">⏳ يحلل...</div>`;
  ms.scrollTop=ms.scrollHeight;

  const ctx=`السهم:${S.sym} السعر:$${S.price} P/C:${S.pcr} IVR:${S.ivr}% Delta:${S.greeks.d} Gamma:${S.greeks.g} Theta:${S.greeks.t} FearGreed:${S.fg} GEX:${S.gammaLevels.reduce((s,l)=>s+l.net,0)>0?'موجب':'سالب'} Calls:${S.calls.length} Puts:${S.puts.length} FlowAlerts:${S.flowAlerts.length}`;
  try{
    const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,context:ctx})});
    const d=await r.json();
    const t=$('aiTmp');if(t)t.outerHTML=`<div class="ai-m b">${d.reply||d.error||'خطأ'}</div>`;
  }catch(e){
    const t=$('aiTmp');if(t)t.outerHTML=`<div class="ai-m b" style="border-right-color:var(--r)">⚠️ أضف ANTHROPIC_API_KEY في Vercel</div>`;
  }
  ms.scrollTop=ms.scrollHeight;
}
function askAI(q){$('aiIn').value=q;sendAI();}

function updateAIBtns(){
  $('aiQuick').innerHTML=[
    ['أقوى سيولة','ما أقوى 3 أسهم عليها تراكم سيولة في الخيارات؟'],
    ['جدار γ','أين جدار الغاما لـ '+S.sym+'؟ وما التوقع؟'],
    ['Greeks','حلل Greeks لـ '+S.sym+' — هل السوق متفائل أم يتحوط؟'],
    ['استراتيجية','أفضل استراتيجية خيارات لـ '+S.sym+' الآن بناءً على البيانات'],
    ['تنبؤ','ما توقعك لحركة '+S.sym+' القادمة بناءً على GEX و Flow؟'],
  ].map(([l,q])=>`<button class="ai-qb" onclick="askAI('${q}')">${l}</button>`).join('');
}

// ──── CONTROLS ────
function setTF(tf,btn){S.tf=tf;$('tfBtns').querySelectorAll('.cb').forEach(b=>b.classList.toggle('on',b===btn));go(S.sym);}
function togInd(k,btn){S.ind[k]=!S.ind[k];btn.classList.toggle('on',S.ind[k]);drawChart();}
function setView(btn){document.querySelectorAll('.htab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
async function chgExp(exp){
  const od=await fetchOpts(S.sym,exp);
  if(od){S.calls=od.calls||[];S.puts=od.puts||[];S.expiry=od.expiry;
    S.gammaLevels=calcGEX(S.calls,S.puts,S.price);calcAggG(S.calls,S.puts,S.price);setTab(S.tab);}
}

// ──── CLOCK ────
function tick(){
  const now=new Date();
  $('clock').textContent=now.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
  const et=new Date(now.toLocaleString('en-US',{timeZone:'America/New_York'}));
  const h=et.getHours(),m=et.getMinutes(),dy=et.getDay();
  const open=dy>=1&&dy<=5&&(h>9||(h===9&&m>=30))&&h<16;
  const pre=dy>=1&&dy<=5&&h>=4&&(h<9||(h===9&&m<30));
  const aft=dy>=1&&dy<=5&&h>=16&&h<20;
  const ms=$('mstat');
  if(open){ms.textContent='🟢 مفتوح';ms.className='bdg bdg-g';}
  else if(pre){ms.textContent='🟡 ما قبل';ms.className='bdg bdg-y';}
  else if(aft){ms.textContent='🟠 ما بعد';ms.className='bdg bdg-o';}
  else{ms.textContent='🔴 مغلق';ms.className='bdg bdg-r';}
}

// ──── TICKER TAPE ────
async function initTicker(){
  const syms=['SPY','QQQ','DIA','IWM','AAPL','TSLA','NVDA','MSFT','AMZN','META','GOOGL','AMD','NFLX','COIN'];
  const el=$('ticker');
  el.innerHTML=syms.map(s=>`<span class="tk"><span class="s">${s}</span><span style="color:var(--t3)">—</span></span>`).join('')+syms.map(s=>`<span class="tk"><span class="s">${s}</span><span style="color:var(--t3)">—</span></span>`).join('');

  for(const sym of syms){
    try{
      const r=await fetch(`/api/stock?s=${sym}&range=1d&interval=5m`);
      const d=await r.json();
      if(d.price)S.wlD[sym]={price:d.price,chg:d.change,pct:d.changePct};
    }catch(e){}
  }

  const mkTk=()=>syms.map(s=>{
    const d=S.wlD[s]||{};const up=(d.chg||0)>=0;
    return`<span class="tk"><span class="s">${s}</span><span style="color:${up?'var(--g)':'var(--r)'}">${d.price?'$'+fN(d.price):'—'}</span><span style="color:${up?'var(--g)':'var(--r)'};font-size:9px">${d.pct?(up?'+':'')+d.pct+'%':''}</span></span>`;
  }).join('');
  el.innerHTML=mkTk()+mkTk();
  renderWL();
}

// ──── INIT ────
tick();setInterval(tick,1000);
go('AAPL');initTicker();
setInterval(()=>{if(!S.loading)go(S.sym);},90000);
window.addEventListener('resize',()=>{drawChart();if(S.tab==='gamma')setTimeout(()=>drawGamma(S.gammaLevels),50);});
</script>
